[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detective-live-gateway"
version = "0.1.0"
description = "Optional HTTP gateway for the separate AI Detective frontend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
ai-detective-live-gateway = "live_gateway.api:main"

[tool.setuptools.packages.find]
where = ["src"]
